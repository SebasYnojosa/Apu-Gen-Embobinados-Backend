spring.application.name=apugen-backend

#Configuración del servidor
server.port=8080

#Conexión a postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/embobinados_apu
spring.datasource.username=admin
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate / JPA
# "create" eliminará todas las tablas y las creará desde cero, esto debido a que estas estarán cambiando constantemente
# en estas etapas tempranas de desarrollo
spring.jpa.hibernate.ddl-auto=create
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Opciones para ver las consultas SQL en la consola (muy útil para debug)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
